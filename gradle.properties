# ============================================================================
# mica-sherpa-onnx gradle.properties
# ============================================================================

# ----------------------------------------------------------------------------
# 版本号 (sherpa-onnx 版本)
# 命令行覆盖: ./gradlew build -Pversion=1.14.0
# ----------------------------------------------------------------------------
version=1.13.5

# ----------------------------------------------------------------------------
# GPG 签名配置 (发布到 Maven Central 必需)
# 请在 ~/.gradle/gradle.properties 中设置真实值，不要提交到版本控制
#
# 推荐方式一: 直接调用本机 gpg 签名（signing.gnupg 模式）
# 兼容 ed25519/EdDSA 密钥，不经过 Gradle 内嵌 BouncyCastle，避免
# "unknown public key algorithm" 报错。Windows 上请确保 gpg 在 PATH 中。
# ----------------------------------------------------------------------------
# signing.gnupg.keyName=7C6714B7A861D6AE   # GPG 密钥 ID（完整指纹或最后 8 位）
# signing.gnupg.passphrase=YourGpgPassword # GPG 密钥密码
# signing.gnupg.executable=gpg             # gpg 可执行文件（Windows 可写完整路径）
#
# 方式二: 旧式 secring.gpg 方式（GPG 2.1+ 不再自动生成 secring.gpg，需手动导出）
# ----------------------------------------------------------------------------
# signing.keyId=ABCD1234                   # GPG 密钥 ID (最后8位)
# signing.password=YourGpgPassword         # GPG 密钥密码
# signing.secretKeyRingFile=/path/to/secring.gpg  # GPG 密钥环文件路径

# ----------------------------------------------------------------------------
# Central Portal 凭据 (https://central.sonatype.com)
# 使用 Central Portal User Token 认证（非 Sonatype 账号密码）
# 生成方式: 登录 central.sonatype.com -> Account -> User Token -> Generate
# 请在 ~/.gradle/gradle.properties 中设置真实值，不要提交到版本控制
# ----------------------------------------------------------------------------
# sonatypeUsername=YourCentralPortalTokenUsername
# sonatypePassword=YourCentralPortalTokenPassword

# ----------------------------------------------------------------------------
# Gradle 配置
# ----------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
